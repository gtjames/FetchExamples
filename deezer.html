<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deezer Music Search</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-indigo.css" id="css" >
    <link rel="stylesheet" href="styles/deezer.css">
</head>
<body>
    <div class="w3-container w3-theme-l1">
        <div id="menu" class="w3-bar"></div>
    </div>

  <header>
    <h1>🎵 Deezer Music Search</h1>
    <p>Search for your favourite tracks powered by the Deezer API</p>
  </header>

  <div class="search-bar">
    <input type="text" id="query" placeholder="e.g. Neil Diamond" value="neil diamond" />
    <button id="searchBtn" onclick="search()">Search</button>
  </div>

  <div id="status">Enter a search term and click Search.</div>
  <div id="results"></div>
<script src="js/allKeys.js"></script>
<script src="js/deezer.js" type="module"></script>
<script src="js/menu.js"></script>
<script>makeMeActive('Deezer')</script>
</body>
</html>
