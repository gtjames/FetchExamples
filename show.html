<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Blank Page</title>
</head>
<body>
    <input type="password" id="key" placeholder="Enter your API key" />
	<button onclick="showMovies()">Show Movies</button>
    <br>
    <data id="movieData"></data>
	<script>
        movieList = document.getElementById("movieData");
    function showMovies() {
       let apiKey = document.getElementById("key").value;
       let url = `http://www.omdbapi.com/?s=Jaws&apikey=${apiKey}`;
       movieList.innerHTML = "";     // clear the screen
        fetch(url)                                            //  make the request
        .then(response => response.json())
        .then(movies => {
            for (let m of movies.Search) {
                  movieList.innerHTML += `${m.Title} (${m.Year}) <img src="${m.Poster}" style="width:30px;height:20px;" alt="${m.Title}"><BR>`;
           }
            text = "<table border='1'><tr><th>Title</th><th>Year</th><th>Poster</th></tr>";
            for (let m of movies.Search) {
                  text += `<tr><td>${m.Title}</td><td>${m.Year}</td><td><img src="${m.Poster}" style="width:90px;height:90px;" alt="${m.Title}"></td></tr>`;
           }
            movieList.innerHTML += text + "</table>";

        } );
}
	</script>
</body>
</html>
