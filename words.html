<!DOCTYPE html>
<html lang="en">

<head>
    <title>Words</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-indigo.css" id="css" >
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="w3-theme-l1">

<div class="w3-container w3-theme-l1">
    <div id="menu" class="w3-bar"></div>
</div>

<div class="w3-container w3-theme w3-padding-16">
    <label for="wordSearch">Search for Meaning</label>
    <input type="text" id="wordSearch" value="mars">
    <button id="search">Search</button>
    <button id="similar" >Similar</button>
    <p>Columns are sortable</p>
</div>
<div class="w3-container w3-theme-l3 w3-padding-16">
    <table class='w3-table-all sortable w3-theme'>
        <thead>
        <tr class="w3-theme-l4 w3-bordered">
            <th>Definition</th>  <th>Instance Of</th> <th>Derivation</th> <th>Synonyms</th> <th>Similar To</th>
        </tr>
        </thead>
        <tbody id='wordList'>   </tbody>
    </table>
</div>
</body>
<script src="js/allKeys.js"></script>
<script>
    let theKey = keys.keyRapidAPI;
    let searchText = '';
    let search = document.getElementById('search');
    let tableBody = document.getElementById('wordList');
    let similar = document.getElementById('similar');

    search.addEventListener('click', wordSearch);
    similar.addEventListener('click', () => {
        fetch(`https://wordsapiv1.p.rapidapi.com/words/${searchText}/similarTo`, options)
            .then(response => response.json())
            .then(response => similarTo(response, searchText))
            .catch(err => console.error(err));
    });

    const options = {
        method: 'GET',
            headers: {
                'X-RapidAPI-Key': theKey,
                'X-RapidAPI-Host': 'wordsapiv1.p.rapidapi.com'
            }
    };

    function wordSearch() {
        searchText = document.getElementById('wordSearch').value;

        fetch(`https://wordsapiv1.p.rapidapi.com/words/${searchText}`, options)
	        .then(response => response.json())
	        .then(response => showWords(response, searchText))
	        .catch(err => console.error(err));
    }
    function showWords(words, searchText) {
        let row = '';
        words.results.forEach((word,idx) => {
            if (word.synonyms === undefined)    word.synonyms = [];
            let instanceOf = '';
            let synonyms     = '';
            let derivation = '';
            word.instanceOf?.forEach(s => instanceOf += `<li>${s}</li>`);
            word.derivation?.forEach(s => derivation += `<li>${s}</li>`);
            word.synonyms?.forEach(s => synonyms += `<li>${s}</li>`);
            row += `<tr class="w3-theme-${idx%2>0?'l2':'l3'}">
                        <td>${word.definition}</td>
                        <td><ul>${instanceOf}</ul></td>
                        <td><ul>${derivation}</ul></td>
                        <td><ul>${synonyms}</ul></td>
                        <td></td>
                    </tr>`
        });
        tableBody.innerHTML = row;
    }

    function similarTo(words, searchText) {
        let list = words.similarTo?.map(s => `<li>${s}</li>`).join('');
        tableBody.innerHTML = '<tr class="w3-theme-l3"><td colspan="5"><ul>' + list + '</ul></td></tr>';
    }
    function setKey() { theKey = getKey(); }

</script>
<script src="js/menu.js"></script>
<script src="js/sortColumns.js"></script>
<script>makeMeActive('Words')</script>

</html>
